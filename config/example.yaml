# Optional overrides applied on top of the frozen paper profile.
# The proposed method and final-batch GNSS calibration remain enabled unless
# explicitly overridden here.
out_dir: results
odometry:
  preprocessing:
    min_range: 1.0
    max_range: 50.0
    deskew: true
gnss:
  batch_final_calibration_enabled: true
  batch_calibration_min_observations: 20
  max_anchor_optimization_shift_m: 50.0

# These values describe input coordinates and are consumed by the adapter,
# not by the KISS-SLAM pydantic configuration.
geodesy:
  quality_policy: covariance_only
  timestamp_offset_s: 0.0
  map_translation_m: [0.0, 0.0, 0.0]
  yaw_alignment_rad: 0.0

